name: rebuild site

# Runs every time Fisher pushes. Regenerates the pages from the folders
# and commits the result back. Nothing to configure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild pages from folders
        run: python3 build.py

      - name: Commit any changes
        run: |
          git config user.name  "site robot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "rebuild site [skip ci]"
            git push
          else
            echo "nothing changed"
          fi
