      ADD A TRACK: put the .wav in the music/ folder, then copy a block
      below and paste it above the others. Change the title, the year,
      and BOTH places the filename appears. Audio must be pushed with
      git - see HOWTOUPDATE.md
    -->

    <!--
      ADD AN ALBUM TRACK: put the .wav in the music/ folder, then paste a
      block like this. Change the title, the year, and BOTH places the
      filename appears. Audio must be pushed with git - see HOWTOUPDATE.md

      <div class="track">
        <div class="track-title">title</div>
        <div class="track-info">2026</div>
        <audio controls preload="none">
          <source src="music/filename.wav" type="audio/wav">
        </audio>
        <a href="music/filename.wav" download class="track-download">download</a>
      </div>
    -->
